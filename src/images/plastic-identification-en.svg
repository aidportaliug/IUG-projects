<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 720" width="1640" height="720" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" role="img" aria-label="How to identify plastics: float tests">
  <title>How to identify plastics: float tests</title>
